name: Release DMG

on:
  push:
    tags:
      - '**'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build and package DMG
        run: bash scripts/build-dmg.sh "$RELEASE_TAG"

      - name: Create release and upload DMG
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.dmg dist/*.sha256 --clobber
          else
            gh release create "$RELEASE_TAG" dist/*.dmg dist/*.sha256 \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi
